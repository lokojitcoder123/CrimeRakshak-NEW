version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: crimerakshak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crimerakshak
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d crimerakshak"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crimerakshak-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - ENVIRONMENT=production
      - POSTGRES_URI=postgresql://user:password@postgres:5432/crimerakshak
      - DATASETS_DIR=/datasets
      - DUCKDB_PATH=crime_stats.duckdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - datasets_data:/datasets

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: crimerakshak-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:9000/api/v1
      - BACKEND_URL=http://backend:9000
    depends_on:
      - backend

volumes:
  pgdata:
  datasets_data:
